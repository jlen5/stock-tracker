  $('#pHistory').innerHTML = `<table class="tbl"><thead><tr><th>Date</th><th>Ticker</th><th>Type</th><th>Shares</th><th>Price</th><th>Amount</th><th><span class="sr">Delete</span></th></tr></thead><tbody>${
    list.map(t => `<tr data-tid="${esc(t.id)}" tabindex="0"><td>${esc(fmtDate(t.date))}</td><td><b>${esc(t.sym)}</b></td><td><span class="tside ${t.side}">${t.side}</span></td>
      <td>${fmtQty(t.qty)}</td><td>${fmtPrice(t.price)}<span class="sub">${esc(t.cur)}</span></td><td>${fmtPrice(t.qty * t.price)}<span class="sub">${esc(t.cur)}</span></td>
      <td><button class="icon-btn sm" type="button" data-del="${esc(t.id)}" aria-label="Delete ${t.side} of ${esc(t.sym)} on ${esc(fmtDate(t.date))}" title="Delete">${icon('trash', 14)}</button></td></tr>`).join('')}</tbody></table>`;
}

let ftipEl = null;
function hideTradeTip() { if (ftipEl) ftipEl.hidden = true; }
function showTradeTip(tr, x, y) {
  const c = port.calc, t = state.trades.find(z => z.id === tr.dataset.tid);
  if (!c || c.empty || !t) { hideTradeTip(); return; }
  if (!ftipEl) { ftipEl = document.createElement('div'); ftipEl.className = 'tip ftip'; ftipEl.setAttribute('role', 'tooltip'); document.body.append(ftipEl); }
  ftipEl.innerHTML = tradeTipHTML(t, c.trRes[t.id], c.disp);
  ftipEl.hidden = false;
  const w = ftipEl.offsetWidth, h = ftipEl.offsetHeight;
  let left = x + 16, top = y + 16;
  if (left + w > innerWidth - 8) left = Math.max(8, x - w - 16);
  if (top + h > innerHeight - 8) top = Math.max(8, y - h - 12);
  ftipEl.style.left = left + 'px'; ftipEl.style.top = top + 'px';
}

function drawPortChart() {
  const el = $('#pChart');
  if (!el) return;
  const c = port.calc;
  if (!c || c.empty) { el.innerHTML = `<div class="ph">${port.loading ? 'Loading prices…' : esc(port.err || 'No price data to chart yet.')}</div>`; port.geo = null; return; }
  if (port.table) {
    const [t0, t1] = portWindow(c, state.portRange), rows = [];
    for (let i = t1; i >= t0 && rows.length < 400; i--) {
      const g = c.value[i] - c.invested[i];
      rows.push(`<tr><td>${esc(fmtDate(c.dates[i]))}</td><td>${money(c.value[i], c.disp)}</td><td>${money(c.invested[i], c.disp)}</td><td class="${dir(g)}">${money(g, c.disp, true)}</td></tr>`);
    }
    el.innerHTML = `<div class="tablewrap" style="height:100%;max-height:none"><table><thead><tr><th>Date</th><th>Value · ${c.disp}</th><th>Net invested</th><th>Gain</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
    port.geo = null;
    return;
  }
  const W = Math.floor(el.clientWidth), H = Math.floor(el.clientHeight);
  if (W < 120 || H < 120) return;
  const [i0, i1] = portWindow(c, state.portRange), span = i1 - i0;
  let lo = Infinity, hi = -Infinity;
  for (let i = i0; i <= i1; i++) { lo = Math.min(lo, c.value[i], c.invested[i]); hi = Math.max(hi, c.value[i], c.invested[i]); }
  if (hi === lo) { const d = Math.abs(hi) * 0.01 || 1; hi += d; lo -= d; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const { ticks, decimals } = niceTicks(lo, hi, 5);
  const yfmt = nf(decimals, decimals);
  const labW = (ticks.length ? Math.max(...ticks.map(t => yfmt.format(t).length)) : 6) * 6.7 + 14;
  const m = { l: 6, r: Math.max(48, Math.ceil(labW)), t: 10, b: 24 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const X = i => m.l + (span ? (i - i0) / span * pw : pw / 2);
  const Y = v => m.t + (1 - (v - lo) / (hi - lo)) * ph;

  let line = '', step = '';
  for (let i = i0; i <= i1; i++) {
    const x = X(i).toFixed(1);
    line += (i === i0 ? 'M' : 'L') + x + ',' + Y(c.value[i]).toFixed(1);
    step += i === i0 ? `M${x},${Y(c.invested[i]).toFixed(1)}` : `H${x}V${Y(c.invested[i]).toFixed(1)}`;
  }
  const base = (m.t + ph).toFixed(1);
  const area = span ? `${line}L${X(i1).toFixed(1)},${base}L${X(i0).toFixed(1)},${base}Z` : '';
  let grid = '';
  for (const t of ticks) {
    const y = Y(t).toFixed(1);
    grid += `<line x1="${m.l}" x2="${m.l + pw}" y1="${y}" y2="${y}" stroke="var(--rule-2)"/><text x="${m.l + pw + 8}" y="${(+y + 4).toFixed(1)}">${yfmt.format(t)}</text>`;
  }
  const spanMs = Date.parse(c.dates[i1]) - Date.parse(c.dates[i0]);
  const tf = dtf('UTC', spanMs <= 400 * DAY ? { month: 'short', day: 'numeric' } : { month: 'short', year: 'numeric' });
  const nx = span ? Math.min(span + 1, Math.max(2, Math.min(6, Math.floor(pw / 90)))) : 1;
  let xl = '';
  for (let k = 0; k < nx; k++) {
    const idx = nx === 1 ? i0 : Math.round(i0 + k * span / (nx - 1));
    const anchor = k === 0 && nx > 1 ? 'start' : k === nx - 1 && nx > 1 ? 'end' : 'middle';
    xl += `<text x="${X(idx).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${esc(tf.format(new Date(c.dates[idx] + 'T00:00:00Z')))}</text>`;
  }
  const endDot = `<circle cx="${X(i1).toFixed(1)}" cy="${Y(c.value[i1]).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  const marks = [];
  for (const t of state.trades) {
    if (!c.trRes[t.id]) continue;
    const idx = c.dates.indexOf(t.date);
    if (idx >= i0 && idx <= i1) marks.push({ t, idx });
  }
  const markSvg = marks.map(mk => {
    const x = X(mk.idx), y = Y(c.value[mk.idx]), up = mk.t.side === 'buy';
    const d = up ? `M${x.toFixed(1)},${(y - 7).toFixed(1)}L${(x + 6).toFixed(1)},${(y + 4.5).toFixed(1)}L${(x - 6).toFixed(1)},${(y + 4.5).toFixed(1)}Z`
                 : `M${x.toFixed(1)},${(y + 7).toFixed(1)}L${(x + 6).toFixed(1)},${(y - 4.5).toFixed(1)}L${(x - 6).toFixed(1)},${(y - 4.5).toFixed(1)}Z`;
    return `<path class="mk ${mk.t.side}" d="${d}" fill="var(--${up ? 'up' : 'down'})" stroke="var(--surface)" stroke-width="1.5" stroke-linejoin="round"/>`;
  }).join('');
  const label = `Portfolio value in ${c.disp} from ${money(c.value[i0], c.disp)} to ${money(c.value[i1], c.disp)}, with net invested for comparison. Use the Table button for the data.`;
  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">
      <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.2"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
      ${grid}
      <line x1="${m.l}" x2="${m.l + pw}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--rule)"/>
      ${area ? `<path d="${area}" fill="url(#pg)"/>` : ''}
      <path d="${step}" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${endDot}${markSvg}${xl}
      <g class="hv" style="display:none"><line y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-3)" stroke-dasharray="3 3"/><circle r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></g>
    </svg><div class="tip" hidden></div>`;
  port.geo = { m, pw, i0, i1, W, X, Y, marks };
}
function portHover(e) {
  const g = port.geo, c = port.calc, el = $('#pChart');
  if (!g || !c || c.empty) return;
  const x = e.clientX - el.getBoundingClientRect().left;
  const i = g.i1 === g.i0 ? g.i0 : Math.max(g.i0, Math.min(g.i1, Math.round(g.i0 + (x - g.m.l) / g.pw * (g.i1 - g.i0))));
  const hv = $('.hv', el), tip = $('.tip', el);
  if (!hv || !tip) return;
  const px = g.X(i);
  hv.style.display = '';
  hv.firstElementChild.setAttribute('x1', px); hv.firstElementChild.setAttribute('x2', px);
  hv.lastElementChild.setAttribute('cx', px); hv.lastElementChild.setAttribute('cy', g.Y(c.value[i]));
  const gain = c.value[i] - c.invested[i], pct = c.invested[i] > 0 ? gain / c.invested[i] * 100 : 0;
  tip.innerHTML = `<div class="t-date">${esc(fmtDate(c.dates[i]))}</div><div class="t-price">${money(c.value[i], c.disp)}</div>
    <div class="t-row"><span>In ${c.alt}</span><b>${money(c.valueAlt[i], c.alt)}</b></div>
    <div class="t-row"><span>Net invested</span><b>${money(c.invested[i], c.disp)}</b></div>
    <div class="t-row"><span>Gain</span><b class="${dir(gain)}">${money(gain, c.disp, true)}${c.invested[i] > 0 ? ' (' + fmtPct(pct) + ')' : ''}</b></div>`
    + (g.marks || []).filter(mk => Math.abs(g.X(mk.idx) - px) <= 7).map(mk => tradeTipHTML(mk.t, c.trRes[mk.t.id], c.disp)).join('');
  tip.hidden = false;
  const tw = tip.offsetWidth;
  let left = px + 14;
  if (left + tw > g.W - 4) left = px - tw - 14;
  tip.style.left = Math.max(4, left) + 'px';
}
function hidePortHover() {
  const el = $('#pChart');
  const hv = el && $('.hv', el), tip = el && $('.tip', el);
  if (hv) hv.style.display = 'none';
  if (tip) tip.hidden = true;
}

/* ---------------- actions ---------------- */
function commit(symbols) {
  const v = currentView();
  const added = [], dups = [];
  for (const raw of symbols) {
    const s = String(raw).trim().toUpperCase();
    if (!SYM_RE.test(s)) continue;
    if (v.tickers.includes(s) || added.includes(s)) { if (!dups.includes(s)) dups.push(s); }
    else { v.tickers.push(s); added.push(s); }
  }
  if (added.length) {
    save(); renderAll();
    const last = cards.get(added[added.length - 1]);
    requestAnimationFrame(() => {
      if (!last) return;
      last.el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      last.el.classList.add('flash');
      setTimeout(() => last.el.classList.remove('flash'), 1300);
    });
    toast(`Added ${added.join(', ')}${dups.length ? ` (${dups.join(', ')} already here)` : ''}`);
  } else if (dups.length) {
    toast(`${dups.join(', ')} ${dups.length > 1 ? 'are' : 'is'} already on this screen`);
  }
}

function removeTicker(sym) {
  const v = currentView();
  const i = v.tickers.indexOf(sym);
  if (i < 0) return;
  v.tickers.splice(i, 1);
  closeMenu(); save(); renderAll();
  toast(state.activeId === 'scratch' ? `Removed ${sym}` : `Removed ${sym} from “${v.name}”`);
}

function createFolder(name) {
  const f = { id: uid(), name: name.trim().slice(0, 40) || 'Untitled', tickers: [] };
  state.folders.push(f);
  save(); renderRail(); refreshChrome();
  return f;
}

function setMembership(sym, folderId, on) {
  const f = state.folders.find(x => x.id === folderId);
  if (!f) return;
  const has = f.tickers.includes(sym);
  if (on && !has) f.tickers.push(sym);
  if (!on && has) f.tickers = f.tickers.filter(s => s !== sym);
  save(); renderRail();
  if (state.activeId === folderId) { closeMenu(); renderBoard(); }
  refreshChrome();
}

function switchView(id) {
  if (id === state.activeId) return;
  closeMenu();
  state.activeId = id; save();
  renderAll();
  window.scrollTo({ top: 0 });
}

function deleteFolder(id) {
  state.folders = state.folders.filter(f => f.id !== id);
  if (state.activeId === id) state.activeId = 'scratch';
  save(); renderAll();
}

/* ---------------- rail (folders) ---------------- */
const viewList = $('#viewList'), folderList = $('#folderList'), newSlot = $('#newFolderSlot');
let renamingId = null, confirmingId = null, creating = false;

function renderRail() {
  viewList.innerHTML = `<li><button class="nav" type="button" data-act="view" data-id="scratch" aria-current="${state.activeId === 'scratch'}">${icon('grid')}<span class="nav-name">Scratchpad</span><span class="count">${state.scratch.length}</span></button></li>
    <li><button class="nav" type="button" data-act="view" data-id="portfolio" aria-current="${state.activeId === 'portfolio'}">${icon('pie')}<span class="nav-name">Portfolio</span><span class="count">${state.trades.length}</span></button></li>`;

  folderList.innerHTML = state.folders.map(f => {
    if (confirmingId === f.id) {
      return `<li class="confirm"><span>Delete “${esc(f.name)}”?<small>The tickers themselves aren’t affected.</small></span>
        <button type="button" class="danger" data-act="delete-yes" data-id="${esc(f.id)}">Delete</button>
        <button type="button" data-act="delete-no">Keep</button></li>`;
    }
    if (renamingId === f.id) {
      return `<li><form class="inline" data-form="rename" data-id="${esc(f.id)}">
        <input type="text" maxlength="40" value="${esc(f.name)}" aria-label="Folder name">
        <button class="icon-btn sm" type="submit" aria-label="Save name">${icon('check')}</button></form></li>`;
    }
    return `<li><button class="nav" type="button" data-act="view" data-id="${esc(f.id)}" aria-current="${state.activeId === f.id}">${icon('folder')}<span class="nav-name">${esc(f.name)}</span><span class="count">${f.tickers.length}</span></button>
      <span class="nav-actions">
        <button class="icon-btn sm" type="button" data-act="rename" data-id="${esc(f.id)}" aria-label="Rename ${esc(f.name)}" title="Rename">${icon('pencil', 14)}</button>
        <button class="icon-btn sm" type="button" data-act="delete" data-id="${esc(f.id)}" aria-label="Delete ${esc(f.name)}" title="Delete">${icon('trash', 14)}</button>
      </span></li>`;
  }).join('');

  newSlot.innerHTML = creating
    ? `<form class="inline" data-form="create"><input type="text" maxlength="40" placeholder="Folder name" aria-label="New folder name"><button class="icon-btn sm" type="submit" aria-label="Create folder">${icon('check')}</button></form>`
    : `<button class="new-folder" type="button" data-act="new">${icon('plus')}New folder</button>`;
  $('#folderHint').hidden = state.folders.length > 0;

  const focusInput = $('input', folderList) || $('input', newSlot);
  if (focusInput && (renamingId || creating)) { focusInput.focus(); focusInput.select(); }
}

$('.rail').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case 'view': switchView(id); break;
    case 'new': creating = true; renamingId = null; confirmingId = null; renderRail(); break;
    case 'rename': renamingId = id; confirmingId = null; creating = false; renderRail(); break;
    case 'delete': confirmingId = id; renamingId = null; creating = false; renderRail(); break;
    case 'delete-no': confirmingId = null; renderRail(); break;
    case 'delete-yes': confirmingId = null; deleteFolder(id); break;
  }
});
$('.rail').addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const name = form.querySelector('input').value.trim();
  if (form.dataset.form === 'create') {
    creating = false;
    if (name) { const f = createFolder(name); switchView(f.id); } else renderRail();
  } else if (form.dataset.form === 'rename') {
    const f = state.folders.find(x => x.id === form.dataset.id);
    renamingId = null;
    if (f && name) { f.name = name.slice(0, 40); save(); }
    renderAll();
  }
});
$('.rail').addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (creating || renamingId) { creating = false; renamingId = null; renderRail(); }
});

/* ---------------- board ---------------- */
const boardEl = $('#board');

function persistOrder() {
  const order = [...boardEl.querySelectorAll('.card')].map(c => c.dataset.sym);
  const v = currentView();
  if (order.length !== v.tickers.length || !order.every(s => v.tickers.includes(s))) return;
  v.tickers.splice(0, v.tickers.length, ...order);
  save();
}

/* Drag a card by its handle. The card follows the pointer; when the pointer
   passes over another card, the two swap places and the others slide aside. */
function startReorder(card, e) {
  if (e.button !== 0) return;
  const el = card.el, pid = e.pointerId;
  const startX = e.clientX, startY = e.clientY;
  let active = false, lastX = startX, lastY = startY, grabX = 0, grabY = 0, raf = 0, lastSwap = 0;

  const cardsNow = () => [...boardEl.querySelectorAll('.card')];
  const place = () => {
    el.style.transform = 'none';
    const r = el.getBoundingClientRect();
    el.style.transform = `translate(${lastX - grabX - r.left}px, ${lastY - grabY - r.top}px)`;
  };
  const swapAt = () => {
    if (performance.now() - lastSwap < 160) return;
    const others = cardsNow().filter(c => c !== el);
    const hit = others.find(c => { const r = c.getBoundingClientRect(); return lastX >= r.left && lastX <= r.right && lastY >= r.top && lastY <= r.bottom; });
    if (!hit) return;
    const before = new Map(others.map(c => [c, c.getBoundingClientRect()]));
    const list = cardsNow();
    if (list.indexOf(hit) > list.indexOf(el)) hit.after(el); else hit.before(el);
    lastSwap = performance.now();
    for (const [c, r0] of before) {
      const r1 = c.getBoundingClientRect();
      const dx = r0.left - r1.left, dy = r0.top - r1.top;
      if (dx || dy) c.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 180, easing: 'ease-out' });
    }
    place();
  };
  /* Runs every frame while dragging: auto-scroll near the screen edges and
     re-check what is under the pointer, so a swap that was throttled still
     happens once the pointer has settled. */
  const loop = () => {
    if (!active) return;
    const top = 57 + 50, bottom = window.innerHeight - 60;
    const dy = lastY < top ? -Math.min(20, (top - lastY) / 4 + 2) : lastY > bottom ? Math.min(20, (lastY - bottom) / 4 + 2) : 0;
    if (dy) window.scrollBy(0, dy);
    place(); swapAt();
    raf = requestAnimationFrame(loop);
  };
  const begin = () => {
    active = true;
    const r = el.getBoundingClientRect();
    grabX = startX - r.left; grabY = startY - r.top;
    el.classList.add('dragging'); document.body.classList.add('reordering');
    closeMenu(); card.hideHover();
    raf = requestAnimationFrame(loop);
  };
  /* Listen on the window: moving the card in the DOM releases pointer capture,
     so listeners on the handle would stop receiving events after a swap. */
  const onMove = ev => {
    if (ev.pointerId !== pid) return;
    lastX = ev.clientX; lastY = ev.clientY;
    if (!active && Math.hypot(lastX - startX, lastY - startY) > 5) begin();
    if (active) { place(); swapAt(); }
  };
  const finish = ev => {
    if (ev && ev.pointerId !== pid) return;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', finish);
    window.removeEventListener('pointercancel', finish);
    cancelAnimationFrame(raf);
    if (!active) return;
    active = false;
    const shown = el.getBoundingClientRect();
    el.style.transform = 'none';
    const home = el.getBoundingClientRect();
    document.body.classList.remove('reordering');
    const anim = el.animate([{ transform: `translate(${shown.left - home.left}px, ${shown.top - home.top}px)` }, { transform: 'none' }], { duration: 170, easing: 'ease-out' });
    anim.onfinish = anim.oncancel = () => el.classList.remove('dragging');
    persistOrder();
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', finish);
  window.addEventListener('pointercancel', finish);
}
function refreshChrome() { for (const c of cards.values()) c.syncChrome(); }

function renderBoard() {
  const v = currentView();
  const isPort = state.activeId === 'portfolio';
  appEl.dataset.view = isPort ? 'portfolio' : 'board';
  boardEl.hidden = isPort; portEl.hidden = !isPort; $('#curSeg').hidden = false; syncPortControls();
  $('#viewTitle').textContent = v.name;
  if (isPort) { $('#viewSub').textContent = ''; renderPortfolio(); return; }
  $('#viewSub').textContent = v.tickers.length
    ? `${v.tickers.length} ticker${v.tickers.length === 1 ? '' : 's'} · ` + (matchMedia('(pointer: coarse)').matches
      ? 'slide a finger across a chart to read values · drag the dots to reorder'
      : 'drag across a chart to zoom, double-click to reset · drag the dots to reorder')
    : '';
  $('#symInput').placeholder = state.activeId === 'scratch'
    ? 'Add tickers, e.g. AAPL, TSLA, ^GSPC, BTC-USD'
    : `Add tickers to “${v.name}”`;

  if (!v.tickers.length) {
    const msg = state.activeId === 'scratch'
      ? 'Search for a company above, or type one or more tickers separated by commas. Each one gets its own chart.'
      : 'Add tickers here with the search box, or open the Scratchpad and use the folder button on a chart.';
    boardEl.replaceChildren();
    boardEl.insertAdjacentHTML('beforeend', `<div class="empty"><h2>${state.activeId === 'scratch' ? 'Nothing on screen yet' : 'This folder is empty'}</h2><p>${msg}</p>
      <div class="chips">${SUGGESTED.map(s => `<button type="button" class="chip" data-sym="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`);
    return;
  }
  const els = v.tickers.map(s => getCard(s));
  boardEl.replaceChildren(...els.map(c => c.el));
  for (const c of els) { c.syncChrome(); c.syncRanges(); c.ensureFresh(); }
}
boardEl.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) commit([chip.dataset.sym]);
});

function renderAll() { renderRail(); renderBoard(); }

/* ---------------- updated stamp + refresh ---------------- */
function renderUpdated() {
  $('#updated').textContent = lastUpdated
    ? 'Updated ' + new Date(lastUpdated).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })
    : '';
}
const refreshBtn = $('#refreshAll');
refreshBtn.innerHTML = icon('refresh');
async function refreshAll() {
  const v = currentView();
  refreshBtn.classList.add('spinning');
  refreshRates();
  if (state.activeId === 'portfolio') await loadPortfolio(true);
  else await Promise.all(v.tickers.map(s => getCard(s).load()));
  refreshBtn.classList.remove('spinning');
}
refreshBtn.addEventListener('click', refreshAll);
setInterval(() => { if (!document.hidden) refreshAll(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) for (const s of currentView().tickers) getCard(s).ensureFresh();
});

/* ---------------- add / search box ---------------- */
const input = $('#symInput'), sugg = $('#sugg');
let suggItems = [], suggIndex = -1, searchTimer = 0, searchSeq = 0;

const tokens = text => text.split(/[\s,;]+/).filter(Boolean);
const lastToken = text => { const m = text.match(/[^\s,;]*$/); return m ? m[0] : ''; };
const priorTokens = text => tokens(text.slice(0, text.length - lastToken(text).length));

function closeSugg() {
  sugg.hidden = true; suggItems = []; suggIndex = -1;
  input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant');
}
function renderSugg(empty) {
  if (!suggItems.length && !empty) { closeSugg(); return; }
  sugg.innerHTML = suggItems.length
    ? suggItems.map((s, i) => `<li role="option" id="sg${i}" data-i="${i}" aria-selected="${i === suggIndex}"><span class="s-sym">${esc(s.symbol)}</span><span class="s-name">${esc(s.name)}</span><span class="s-meta">${esc(s.meta)}</span></li>`).join('')
    : '<li class="s-empty" role="option" aria-selected="false">No matches. Press Enter to add what you typed.</li>';
  sugg.hidden = false; input.setAttribute('aria-expanded', 'true');
  if (suggIndex >= 0) input.setAttribute('aria-activedescendant', 'sg' + suggIndex); else input.removeAttribute('aria-activedescendant');
}
async function runSearch(q) {
  const seq = ++searchSeq;
  try {
    const url = FILE_MODE ? `https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=8&newsCount=0` : `/api/search?q=${encodeURIComponent(q)}`;
    const json = await getJSON(url);
    if (seq !== searchSeq || lastToken(input.value) !== q) return;
    suggItems = (json.quotes || []).filter(x => x.symbol && SYM_RE.test(String(x.symbol).toUpperCase())).slice(0, 8).map(x => ({
      symbol: x.symbol,
      name: x.longname || x.shortname || '',
      meta: [x.quoteType, x.exchDisp].filter(Boolean).join(' · '),
    }));
    suggIndex = -1;
    renderSugg(true);
  } catch (e) { if (seq === searchSeq) closeSugg(); }
}
input.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = lastToken(input.value);
  if (!q) { closeSugg(); return; }
  searchTimer = setTimeout(() => runSearch(q), 200);
});
function pick(i) {
  const s = suggItems[i]; if (!s) return;
  const prior = priorTokens(input.value);
  input.value = ''; closeSugg();
  commit([...prior, s.symbol]);
  input.focus();
}
input.addEventListener('keydown', e => {
  if (!sugg.hidden && suggItems.length) {
    if (e.key === 'ArrowDown') { e.preventDefault(); suggIndex = (suggIndex + 1) % suggItems.length; renderSugg(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); suggIndex = (suggIndex - 1 + suggItems.length) % suggItems.length; renderSugg(); return; }
    if (e.key === 'Enter' && suggIndex >= 0) { e.preventDefault(); pick(suggIndex); return; }
  }
  if (e.key === 'Escape') closeSugg();
});
sugg.addEventListener('pointerdown', e => {
  const li = e.target.closest('li[data-i]');
  if (li) { e.preventDefault(); pick(+li.dataset.i); }
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('.add')) closeSugg(); });
$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  clearTimeout(searchTimer); searchSeq++;
  const syms = tokens(input.value);
  closeSugg();
  if (!syms.length) { input.focus(); return; }
  input.value = '';
  commit(syms);
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && state.activeId !== 'portfolio' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); }
});

/* ---------------- start ---------------- */
loadState().then(() => { renderAll(); renderUpdated(); });
})();
</script>
</body>
</html>
