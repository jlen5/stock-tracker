<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticker Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a folder rail on the left, a grid of ticker cards on the right.
   Each card = interactive chart on the left, quote facts on the right. */
/* :root {
  --bg: #edf0f4;
  --surface: #ffffff;
  --ink: #131820;
  --ink-2: #465061;
  --ink-3: #646e80;
  --rule: #d9dee6;
  --rule-2: #e9edf2;
  --accent: #2b59d9;
  --up: #0a7a52;
  --down: #bf3a2c;
  --shadow: 0 1px 2px rgba(19, 24, 32, .06);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
} */
/*dark mode by default*/
:root {
  --bg: #0b0e13;
	--surface: #141922;
	--ink: #e7ebf1;
	--ink-2: #a7b0be;
	--ink-3: #8791a2;
	--rule: #262d39;
	--rule-2: #1e2430;
	--accent: #7ea3ff;
	--up: #3fd19a;
	--down: #ff8274;
	--shadow: none;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0e13;
    --surface: #141922;
    --ink: #e7ebf1;
    --ink-2: #a7b0be;
    --ink-3: #8791a2;
    --rule: #262d39;
    --rule-2: #1e2430;
    --accent: #7ea3ff;
    --up: #3fd19a;
    --down: #ff8274;
    --shadow: none;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { flex: none; display: block; }

/* ---------- top bar ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100%; }
.top {
  grid-column: 1 / -1;
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; letter-spacing: .01em; white-space: nowrap; }
.brand svg { color: var(--accent); }

.add { position: relative; flex: 1 1 auto; max-width: 600px; display: flex; align-items: center; gap: 8px; }
.add .field { position: relative; flex: 1; display: flex; align-items: center; }
.add .field .ico { position: absolute; left: 11px; color: var(--ink-3); pointer-events: none; }
.add input {
  width: 100%; height: 36px; padding: 0 34px 0 34px;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--bg);
  font-family: var(--font-num); font-size: 13px;
}
.add input::placeholder { color: var(--ink-3); font-family: var(--font-ui); }
.add kbd {
  position: absolute; right: 9px; font: 500 11px var(--font-num); color: var(--ink-3);
  border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; line-height: 17px;
}
.btn {
  height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--surface); font-weight: 500;
}
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.primary:hover { opacity: .88; }
.sugg {
  position: absolute; top: 42px; left: 0; right: 0; z-index: 40; margin: 0; padding: 4px; list-style: none;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .16); max-height: 340px; overflow: auto;
}
.sugg li { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
.sugg li[aria-selected="true"], .sugg li:hover { background: var(--bg); }
.sugg .s-sym { font: 500 13px var(--font-num); }
.sugg .s-name { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sugg .s-meta { color: var(--ink-3); font-size: 11px; }
.sugg .s-empty { display: block; color: var(--ink-3); cursor: default; }

.status { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.icon-btn {
  display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0;
  border: 0; border-radius: 7px; background: none; color: var(--ink-2); position: relative;
}
.icon-btn:hover { background: var(--bg); color: var(--ink); }
.icon-btn.sm { width: 26px; height: 26px; }
.icon-btn .badge {
  position: absolute; top: 1px; right: 0; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
  background: var(--accent); color: var(--surface); font: 600 10px/15px var(--font-ui); text-align: center;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinning .ico { animation: spin .8s linear infinite; }

/* ---------- folder rail ---------- */
.rail { padding: 18px 12px 20px 16px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.rail h3 { margin: 0 0 6px 8px; font: 600 11px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; justify-content: space-between; }
.rail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rail li { position: relative; display: flex; align-items: center; }
.nav {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 10px;
  border: 0; border-radius: 8px; background: none; text-align: left; color: var(--ink-2);
}
.nav:hover { background: var(--surface); color: var(--ink); }
.nav[aria-current="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--rule); }
.nav-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { font: 400 12px var(--font-num); color: var(--ink-3); }
.nav-actions { position: absolute; right: 36px; display: none; gap: 0; background: var(--surface); border-radius: 7px; }
li:hover > .nav-actions, li:focus-within > .nav-actions { display: flex; }
@media (hover: none) { .nav-actions { display: flex; position: static; background: none; } }
.rail form.inline { flex: 1; display: flex; align-items: center; gap: 2px; }
.rail form.inline input { flex: 1; min-width: 0; height: 32px; padding: 0 9px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); }
.confirm { flex-wrap: wrap; gap: 6px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; font-size: 13px; }
.confirm span { flex: 1 1 100%; }
.confirm small { color: var(--ink-3); display: block; }
.confirm button { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--rule); background: var(--bg); }
.confirm button.danger { background: var(--down); border-color: var(--down); color: var(--surface); }
.new-folder { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 10px; border: 1px dashed var(--rule); border-radius: 8px; background: none; color: var(--ink-2); width: 100%; margin-top: 4px; }
.new-folder:hover { color: var(--ink); border-color: var(--ink-3); }
.folder-hint { margin: 6px 8px 0; color: var(--ink-3); font-size: 12px; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--ink-3); }
.rail-foot .row { display: flex; gap: 14px; margin-left: 8px; }
.link { border: 0; background: none; padding: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; font-size: 12px; }
.link:hover { color: var(--ink); }
.warn-text { margin: 0 8px; color: var(--down); }

/* ---------- main ---------- */
main { padding: 20px 24px 40px; min-width: 0; }
.view-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.view-head h1 { margin: 0; font: 600 22px/1.2 var(--font-ui); }
.view-head p { margin: 0; color: var(--ink-3); }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 16px; align-items: start; }

.empty { grid-column: 1 / -1; padding: 40px 24px; text-align: center; background: var(--surface); border: 1px dashed var(--rule); border-radius: 12px; color: var(--ink-2); }
.empty h2 { margin: 0 0 6px; font: 600 16px var(--font-ui); color: var(--ink); }
.empty p { margin: 0 auto 16px; max-width: 460px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--rule); background: var(--bg); font: 500 12px var(--font-num); }
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- card ---------- */
.card { position: relative; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); }
.card.menu-open { z-index: 12; }
.grip { display: grid; place-items: center; flex: none; width: 24px; height: 30px; margin-left: -10px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--ink-3); cursor: grab; touch-action: none; }
.grip:hover { color: var(--ink); background: var(--bg); }
.card.dragging { z-index: 50; box-shadow: 0 18px 40px rgba(0, 0, 0, .28); border-color: var(--accent); }
body.reordering, body.reordering * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.card.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.card[aria-busy="true"] .chart { opacity: .55; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 2px 16px; }
.id { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.sym { margin: 0; font: 600 18px/1.2 var(--font-ui); letter-spacing: .01em; }
.name { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mkt { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
.mkt::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.mkt.open::before { background: var(--up); }
.tools { display: flex; gap: 2px; align-items: center; }
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: 34px; z-index: 20; width: 240px; padding: 6px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 28px rgba(0, 0, 0, .18);
}
.menu h4 { margin: 4px 8px 6px; font: 600 11px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.menu label { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
.menu label:hover { background: var(--bg); }
.menu input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.menu .none { margin: 2px 8px 8px; color: var(--ink-3); font-size: 12px; }
.menu form { display: flex; gap: 6px; padding: 6px 2px 2px; border-top: 1px solid var(--rule-2); margin-top: 4px; }
.menu form input { flex: 1; min-width: 0; height: 30px; padding: 0 9px; border: 1px solid var(--rule); border-radius: 7px; background: var(--bg); }
.menu form button { height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--rule); background: var(--surface); }

.card-body { container-type: inline-size; display: flex; flex-wrap: wrap; gap: 0 20px; padding: 6px 16px 14px; }
.plot { flex: 1 1 300px; min-width: 0; }
.facts { flex: 0 1 200px; min-width: 180px; padding-top: 6px; }
@container (max-width: 520px) {
  .plot { flex-basis: 100%; }
  .facts { flex-basis: 100%; min-width: 0; margin-top: 8px; }
}
@container (min-width: 400px) and (max-width: 520px) {
  .facts dl { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 24px; }
  .facts dl .wk { grid-column: 1 / -1; }
}

.plot-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; min-height: 30px; }
.ranges { display: flex; gap: 2px; flex-wrap: wrap; }
.rng { height: 26px; padding: 0 9px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); font: 500 12px var(--font-ui); }
.rng:hover { background: var(--bg); color: var(--ink); }
.rng[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.plot { display: flex; flex-direction: column; }
.chart { position: relative; flex: 1 1 280px; min-height: 280px; touch-action: pan-y; cursor: crosshair; user-select: none; -webkit-user-select: none; transition: opacity .15s; }
.chart svg { position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { font: 400 11px var(--font-num); fill: var(--ink-3); }
.chart .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); cursor: default; }
.chart .err { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 0 16px; color: var(--ink-2); cursor: default; }
.plot-foot { display: flex; justify-content: flex-end; gap: 14px; min-height: 22px; margin-top: 6px; }
.chart .err strong { color: var(--down); font-weight: 600; }
.chart .err .row { display: flex; gap: 8px; }
.chart .err button { height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--rule); background: var(--surface); }
.tip {
  position: absolute; top: 4px; z-index: 5; min-width: 150px; padding: 8px 10px; pointer-events: none;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .14);
  font-size: 12px; line-height: 1.5;
}
.tip .t-date { color: var(--ink-3); }
.tip .t-price { font: 500 18px/1.3 var(--font-num); }
.tip .t-row { display: flex; justify-content: space-between; gap: 14px; color: var(--ink-2); }
.tip .t-row b { font: 500 12px var(--font-num); color: var(--ink); }
.up { color: var(--up) !important; }
.down { color: var(--down) !important; }
.note { margin: 6px 0 0; font-size: 12px; color: var(--down); min-height: 0; }
.tablewrap { flex: 1 1 280px; min-height: 280px; max-height: 420px; overflow: auto; border: 1px solid var(--rule-2); border-radius: 8px; }
.tablewrap table { width: 100%; border-collapse: collapse; font: 400 12px var(--font-num); font-variant-numeric: tabular-nums; }
.tablewrap th { position: sticky; top: 0; background: var(--surface); text-align: right; font: 600 11px var(--font-ui); color: var(--ink-3); padding: 7px 10px; border-bottom: 1px solid var(--rule); }
.tablewrap th:first-child, .tablewrap td:first-child { text-align: left; }
.tablewrap td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--rule-2); }

/* ---------- facts ---------- */
.price { font: 500 28px/1.1 var(--font-num); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.price .cur { font: 400 11px var(--font-ui); color: var(--ink-3); margin-left: 6px; letter-spacing: .04em; }
.chg-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-top: 8px; }
.chg-row .lab { font-size: 11px; color: var(--ink-3); }
.chg { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 9px; border-radius: 6px; font: 500 13px var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--bg); color: var(--ink-2); }
.chg.up { background: color-mix(in srgb, var(--up) 13%, transparent); }
.chg.down { background: color-mix(in srgb, var(--down) 13%, transparent); }
.facts dl { margin: 14px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.facts dl > div { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; padding: 6px 0; border-top: 1px solid var(--rule-2); }
.facts dt { color: var(--ink-3); white-space: nowrap; }
.facts dd .sub { display: block; font: 400 11px var(--font-ui); color: var(--ink-3); white-space: normal; line-height: 1.35; }
.facts dd .sub.up, .facts dd .sub.down { font-family: var(--font-num); }
.facts dd { margin: 0 0 0 auto; text-align: right; white-space: nowrap; font: 400 13px var(--font-num); font-variant-numeric: tabular-nums; }
.facts .wk { display: block; }
.facts .wk .top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.wk .lab52 { color: var(--ink-3); }
.wk .bar { position: relative; height: 4px; margin: 8px 0 3px; border-radius: 2px; background: var(--rule); }
.wk .bar i { position: absolute; top: -3px; width: 3px; height: 10px; margin-left: -1px; border-radius: 2px; background: var(--ink); }
.wk .ends { display: flex; justify-content: space-between; font: 400 11px var(--font-num); color: var(--ink-2); }
.asof { margin: 10px 0 0; font-size: 11px; color: var(--ink-3); }
.skel { height: 14px; border-radius: 4px; background: var(--rule-2); margin: 10px 0; }

.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; padding: 9px 16px; border-radius: 9px; background: var(--ink); color: var(--surface); font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); max-width: calc(100vw - 32px); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.toast-act { margin-left: 14px; border: 0; background: none; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 0; }

/* ---------- trades on a card ---------- */
.mk-key { margin-right: auto; display: inline-flex; gap: 14px; align-items: center; font-size: 12px; color: var(--ink-2); }
.mk-key i { display: inline-block; width: 0; height: 0; margin-right: 5px; border-left: 5px solid transparent; border-right: 5px solid transparent; vertical-align: 1px; }
.mk-key .b i { border-bottom: 8px solid var(--up); }
.mk-key .s i { border-top: 8px solid var(--down); }
.trades { margin-top: 10px; padding: 12px; border: 1px solid var(--rule-2); border-radius: 10px; background: var(--bg); }
.tform { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; align-items: end; }
.tform label, .tform .fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; font: 600 11px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.tform input[type="text"], .tform input[type="date"], .tform input[type="number"] {
  width: 100%; min-width: 0; height: 34px; padding: 0 9px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--surface); color: var(--ink); font: 400 13px var(--font-num); text-transform: none; letter-spacing: 0;
}
.tform .curtag { color: var(--ink-2); }
.tform .seg { align-self: start; }
.tform .seg label { position: relative; flex-direction: row; gap: 0; font: 500 13px var(--font-ui); letter-spacing: 0; text-transform: none; color: var(--ink-2); }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg span, .seg button { display: block; height: 28px; padding: 0 14px; border: 0; border-radius: 6px; background: none; line-height: 28px; font: 500 13px/28px var(--font-ui); color: var(--ink-2); }
.seg input[value="buy"]:checked + span { background: var(--up); color: var(--surface); }
.seg input[value="sell"]:checked + span { background: var(--down); color: var(--surface); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.form-err { grid-column: 1 / -1; margin: 0; font-size: 12px; color: var(--down); }
.tlist { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
.tlist li { display: flex; align-items: center; gap: 10px; padding: 5px 2px; border-top: 1px solid var(--rule-2); font: 400 12px var(--font-num); }
.tlist li.none { border-top: 0; padding: 0; color: var(--ink-3); font-family: var(--font-ui); }
.tlist .when { margin-left: auto; color: var(--ink-3); }
.tside { display: inline-block; padding: 1px 7px; border-radius: 4px; font: 600 11px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; }
.tside.buy { color: var(--up); background: color-mix(in srgb, var(--up) 13%, transparent); }
.tside.sell { color: var(--down); background: color-mix(in srgb, var(--down) 13%, transparent); }
.facts dl > div.grp { display: block; padding-top: 14px; border-top: 0; font: 600 11px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.facts dd .sub { display: block; font-size: 11px; color: var(--ink-3); }
.tip .t-cur { font: 400 11px var(--font-ui); color: var(--ink-3); }

<script>
(() => {
'use strict';

/* ---------------- constants ---------------- */
const STORE_KEY = 'tickerboard.v1';
const RANGES = [
  { key: '1D',  range: '1d',  interval: '5m'  },
  { key: '5D',  range: '5d',  interval: '15m' },
  { key: '1M',  range: '1mo', interval: '1d'  },
  { key: '6M',  range: '6mo', interval: '1d'  },
  { key: 'YTD', range: 'ytd', interval: '1d'  },
  { key: '1Y',  range: '1y',  interval: '1d'  },
  { key: '5Y',  range: '5y',  interval: '1wk' },
  { key: 'Max', range: 'max', interval: '1mo' },
];
const DEFAULT_RANGE = '6M';
const STARTER = ['AAPL', 'MSFT', 'NVDA'];
const SUGGESTED = ['AAPL', 'MSFT', 'NVDA', 'TSLA', 'AMZN', 'SPY', '^GSPC', 'BTC-USD'];
const REFRESH_MS = 60000;
const STALE_MS = 30000;
const SYM_RE = /^[A-Z0-9.\-^=]{1,15}$/;
const DAY = 864e5;
const FILE_MODE = location.protocol === 'file:';
const PORT_RANGES = ['1M', '6M', 'YTD', '1Y', 'All'];
const CUR_PREFIX = { USD: 'US$', CAD: 'C$' };

/* ---------------- helpers ---------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ICONS = {
  folderPlus: '<path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/><path d="M8 7v3M6.5 8.5h3"/>',
  folder: '<path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/>',
  grid: '<rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/>',
  x: '<path d="M4 4l8 8M12 4l-8 8"/>',
  plus: '<path d="M8 3v10M3 8h10"/>',
  pencil: '<path d="M3 13l.6-2.8 7.1-7.1a1.4 1.4 0 0 1 2 2l-7.1 7.1z"/>',
  trash: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8h5.8l.6-8"/>',
  check: '<path d="M3.5 8.5l3 3 6-7"/>',
  refresh: '<path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3"/>',
  pie: '<circle cx="8" cy="8" r="5.5"/><path d="M8 2.5V8h5.5"/>',
  grip: '<path d="M5.5 3.5h.01M10.5 3.5h.01M5.5 8h.01M10.5 8h.01M5.5 12.5h.01M10.5 12.5h.01" stroke-width="2.4"/>',
};
const icon = (n, sz = 16) => `<svg class="ico" width="${sz}" height="${sz}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

const nfCache = {};
const nf = (min, max) => nfCache[min + '-' + max] || (nfCache[min + '-' + max] = new Intl.NumberFormat('en-US', { minimumFractionDigits: min, maximumFractionDigits: max }));
const fmtPrice = v => (v == null || !isFinite(v)) ? '—' : (Math.abs(v) >= 1 ? nf(2, 2) : nf(2, 5)).format(v);
const sign = v => v > 0 ? '+' : v < 0 ? '−' : '';
/* Changes follow the price's precision: two decimals above 1.00, up to five for sub-dollar prices. */
const fmtSigned = (v, ref) => sign(v) + (ref != null && Math.abs(ref) >= 1 ? nf(2, 2).format(Math.abs(v)) : fmtPrice(Math.abs(v)));
const fmtPct = v => sign(v) + nf(2, 2).format(Math.abs(v)) + '%';
const compact = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 2 });
const fmtVol = v => v ? compact.format(v) : '—';
const dir = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
const arrow = v => v > 0 ? '▲' : v < 0 ? '▼' : '•';
const money = (v, cur, signed) => {
  if (v == null || !isFinite(v)) return '—';
  const r = Math.round(v * 100) / 100;
  const s = signed ? sign(r) : (r < 0 ? '−' : '');
  return s + (CUR_PREFIX[cur] || (cur ? cur + ' ' : '')) + nf(2, 2).format(Math.abs(r));
};

const dtfCache = {};
function dtf(tz, opts) {
  const k = tz + JSON.stringify(opts);
  if (!dtfCache[k]) {
    try { dtfCache[k] = new Intl.DateTimeFormat('en-US', { ...opts, timeZone: tz || undefined }); }
    catch { dtfCache[k] = new Intl.DateTimeFormat('en-US', opts); }
  }
  return dtfCache[k];
}
function tickOpts(span) {
  if (span <= 2 * DAY) return { hour: 'numeric', minute: '2-digit' };
  if (span <= 9 * DAY) return { weekday: 'short', hour: 'numeric' };
  if (span <= 400 * DAY) return { month: 'short', day: 'numeric' };
  return { month: 'short', year: 'numeric' };
}
const TIP_INTRADAY = { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' };
const TIP_DAILY = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };

function niceTicks(min, max, n) {
  const raw = (max - min) / Math.max(1, n);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const ticks = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) ticks.push(+v.toFixed(10));
  return { ticks, decimals: Math.max(0, Math.ceil(-Math.log10(step) + 1e-9)) };
}

/* ---------------- saved state ---------------- */
const isSym = s => typeof s === 'string' && SYM_RE.test(s.toUpperCase());
const cleanList = a => [...new Set((Array.isArray(a) ? a : []).filter(isSym).map(s => s.toUpperCase()))];
const defaultState = () => ({ activeId: 'scratch', scratch: [...STARTER], folders: [], ranges: {}, trades: [], cur: 'CAD', portRange: 'All' });
const cleanTrade = t => {
  if (!t || typeof t !== 'object') return null;
  const sym = String(t.sym || '').toUpperCase(), price = Number(t.price), qty = Number(t.qty);
  if (!SYM_RE.test(sym) || !(price > 0) || !(qty > 0) || !isFinite(price) || !isFinite(qty)) return null;
  if (t.side !== 'buy' && t.side !== 'sell') return null;
  if (typeof t.date !== 'string' || !validDate(t.date)) return null;
  return { id: typeof t.id === 'string' && t.id ? t.id.slice(0, 40) : uid(), sym, side: t.side, date: t.date, price, qty, cur: /^[A-Za-z]{3,4}$/.test(t.cur || '') ? t.cur : 'USD' };
};

function sanitize(s) {
  const out = { activeId: 'scratch', scratch: [], folders: [], ranges: {}, trades: [], cur: 'CAD', portRange: 'All' };
  if (!s || typeof s !== 'object') return defaultState();
  out.scratch = cleanList(s.scratch);
  if (Array.isArray(s.folders)) {
    out.folders = s.folders
      .filter(f => f && typeof f.id === 'string' && typeof f.name === 'string')
      .map(f => ({ id: f.id, name: f.name.trim().slice(0, 40) || 'Untitled', tickers: cleanList(f.tickers) }));
  }
  if (s.ranges && typeof s.ranges === 'object') {
    for (const k of Object.keys(s.ranges)) {
      if (isSym(k) && RANGES.some(r => r.key === s.ranges[k])) out.ranges[k.toUpperCase()] = s.ranges[k];
    }
  }
  const seen = new Set();
  for (const raw of (Array.isArray(s.trades) ? s.trades : []).slice(0, 5000)) {
    const t = cleanTrade(raw);
    if (!t) continue;
    if (seen.has(t.id)) t.id = uid();
    seen.add(t.id); out.trades.push(t);
  }
  out.cur = s.cur === 'USD' ? 'USD' : 'CAD';
  out.portRange = PORT_RANGES.includes(s.portRange) ? s.portRange : 'All';
  if (s.activeId === 'scratch' || s.activeId === 'portfolio' || out.folders.some(f => f.id === s.activeId)) out.activeId = s.activeId;
  return out;
}
function readBrowserState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return sanitize(JSON.parse(raw));
  } catch (e) { /* nothing usable */ }
  return null;
}
/* The server keeps the data in a file on the host. The browser copy is only
   used when the page is opened without the server (file://), or to carry old
   browser-only data over to the server once. */
let state = defaultState();
let useBrowserStorage = false;
let saveChain = Promise.resolve();
function showSaveWarn(msg) {
  const w = $('#saveWarn');
  w.hidden = !msg; w.textContent = msg || '';
}
function save() {
  if (useBrowserStorage) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); showSaveWarn(''); }
    catch (e) { showSaveWarn('Browser storage is blocked, so changes won’t be kept. Export a backup.'); }
    return;
  }
  const body = JSON.stringify(state);
  saveChain = saveChain.then(() => fetch('/api/state', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body, keepalive: body.length < 60000,
  })).then(res => {
    showSaveWarn(res.ok ? '' : 'Couldn’t save to the server. Check that server.py is running.');
  }).catch(() => showSaveWarn('Couldn’t save to the server. Check that server.py is running.'));
}
async function loadState() {
  if (!FILE_MODE) {
    try {
      const res = await fetch('/api/state');
      if (res.ok) {
        const { state: saved } = await res.json();
        if (saved) { state = sanitize(saved); return; }
        const old = readBrowserState();          // first run on this server: bring old browser data across
        state = old || defaultState();
        save();
        if (old) toast('Moved your saved folders from the browser to this computer');
        return;
      }
    } catch (e) { /* server not reachable: fall back below */ }
  }
  useBrowserStorage = true;
  state = readBrowserState() || defaultState();
  if (FILE_MODE) showSaveWarn('Opened without the server, so data is kept in this browser only. Run server.py to save on this computer.');
}

const currentView = () => state.activeId === 'portfolio'
  ? { id: 'portfolio', name: 'Portfolio', tickers: [] }
  : state.activeId === 'scratch'
  ? { id: 'scratch', name: 'Scratchpad', tickers: state.scratch }
  : state.folders.find(f => f.id === state.activeId) || { id: 'scratch', name: 'Scratchpad', tickers: state.scratch };

/* ---------------- data ---------------- */
async function getJSON(url) {
  let res;
  try { res = await fetch(url); }
  catch (e) {
    throw new Error(FILE_MODE
      ? 'Open Ticker Board through its server: run “python3 server.py”, then visit http://localhost:8000'
      : 'Can’t reach the Ticker Board server. Check that server.py is still running.');
  }
  let body = null;
  try { body = await res.json(); } catch (e) { /* not json */ }
  if (!res.ok) {
    const desc = body && body.chart && body.chart.error && body.chart.error.description;
    if (res.status === 404) throw new Error(desc || 'Symbol not found');
    if (res.status === 429) throw new Error('The data source is limiting requests. Try again in a minute.');
    throw new Error(desc || `The data source returned an error (${res.status}).`);
  }
  return body;
}
const chartURL = (sym, range, interval) => FILE_MODE
  ? `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=${range}&interval=${interval}`
  : `/api/chart?symbol=${encodeURIComponent(sym)}&range=${range}&interval=${interval}`;

/* Yahoo's quote record (P/E, EPS, earnings date, pre/after-hours prices). Nice to
   have: if it can't be loaded the card just leaves those rows out. */
const quoteURL = sym => FILE_MODE ? null : `/api/quote?symbol=${encodeURIComponent(sym)}`;
async function loadQuoteRec(sym) {
  const u = quoteURL(sym);
  if (!u) return null;
  try {
    const j = await getJSON(u);
    return (j && j.quoteResponse && j.quoteResponse.result && j.quoteResponse.result[0]) || null;
  } catch (e) { return null; }
}
const numOrNull = v => typeof v === 'number' && isFinite(v) ? v : null;
/* f: display units per native unit. Everything price-like is converted; P/E is a plain ratio. */
function buildExtra(rec, q, f, show) {
  if (!rec) return null;
  const regT = numOrNull(rec.regularMarketTime) || 0;
  const regP = numOrNull(rec.regularMarketPrice) != null ? rec.regularMarketPrice : q.nativePrice;
  const x = { state: rec.marketState || '', pe: numOrNull(rec.trailingPE), eps: numOrNull(rec.epsTrailingTwelveMonths), epsCur: '', ext: [], earn: null };
  if (x.eps != null) {
    const fc = rec.financialCurrency;
    if (fc && fc !== q.currency) { const c = convert(x.eps, fc, show); if (c != null) x.eps = c; else x.epsCur = fc; }
    else x.eps *= f;
  }
  for (const [label, price, time] of [['Pre-market', rec.preMarketPrice, rec.preMarketTime], ['After hours', rec.postMarketPrice, rec.postMarketTime]]) {
    const p = numOrNull(price), t = numOrNull(time);
    if (p != null && t != null && t > regT && regP) x.ext.push({ label, price: p * f, change: (p - regP) * f, pct: (p / regP - 1) * 100, t: t * 1000 });
  }
  x.ext.sort((a, b) => b.t - a.t);
  const stamps = [rec.earningsTimestampStart, rec.earningsTimestamp, rec.earningsTimestampEnd].map(numOrNull).filter(v => v != null);
  if (stamps.length) {
    const nowS = Date.now() / 1000, upcoming = stamps.filter(s => s > nowS - 43200);
    const end = numOrNull(rec.earningsTimestampEnd);
    if (upcoming.length) {
      const t = Math.min(...upcoming);
      x.earn = { t: t * 1000, next: true, to: end != null && end - t > 86400 ? end * 1000 : null, est: !!rec.isEarningsDateEstimate };
    } else x.earn = { t: Math.max(...stamps) * 1000, next: false, to: null, est: false };
  }
  return x;
}

function parseChart(json) {
  const res = json && json.chart && json.chart.result && json.chart.result[0];
  if (!res) {
    const e = json && json.chart && json.chart.error;
    throw new Error((e && e.description) || 'No data returned for this symbol.');
  }
  const q = (res.indicators && res.indicators.quote && res.indicators.quote[0]) || {};
  const ts = res.timestamp || [];
  const points = [];
  for (let i = 0; i < ts.length; i++) {
    const c = q.close && q.close[i];
    if (c == null || !isFinite(c)) continue;
    points.push({ t: ts[i] * 1000, c, v: (q.volume && q.volume[i]) || 0 });
  }
  return { meta: res.meta || {}, points };
}

function buildQuote(meta, daily) {
  const gmt = (meta.gmtoffset || 0) * 1000;
  const dayKey = ms => new Date(ms + gmt).toISOString().slice(0, 10);
  let prev = meta.chartPreviousClose != null ? meta.chartPreviousClose : null;
  if (daily.length >= 2) {
    const lastDay = dayKey(daily[daily.length - 1].t);
    const mktDay = meta.regularMarketTime ? dayKey(meta.regularMarketTime * 1000) : lastDay;
    prev = lastDay === mktDay ? daily[daily.length - 2].c : daily[daily.length - 1].c;
  }
  const price = meta.regularMarketPrice != null ? meta.regularMarketPrice : (daily.length ? daily[daily.length - 1].c : null);
  const change = prev != null && price != null ? price - prev : null;
  const reg = meta.currentTradingPeriod && meta.currentTradingPeriod.regular;
  const nowS = Date.now() / 1000;
  return {
    price, prev, change,
    pct: change != null && prev ? change / prev * 100 : null,
    dayHigh: meta.regularMarketDayHigh, dayLow: meta.regularMarketDayLow,
    vol: meta.regularMarketVolume,
    high52: meta.fiftyTwoWeekHigh, low52: meta.fiftyTwoWeekLow,
    name: meta.longName || meta.shortName || '',
    currency: meta.currency || '',
    exchange: meta.fullExchangeName || meta.exchangeName || '',
    tz: meta.exchangeTimezoneName || '',

    open: reg ? nowS >= reg.start && nowS <= reg.end : null,
  };
}

/* ---------------- price history + exchange rates ---------------- */
const seriesCache = new Map();
function loadSeries(sym, range, interval = '1d', maxAge = STALE_MS) {
  const k = `${sym}|${range}|${interval}`, hit = seriesCache.get(k);
  if (hit && Date.now() - hit.at < maxAge) return hit.p;
  const p = getJSON(chartURL(sym, range, interval)).then(parseChart);
  const rec = { at: Date.now(), p };
  seriesCache.set(k, rec);
  p.catch(() => { if (seriesCache.get(k) === rec) seriesCache.delete(k); });
  return p;
}
const dayKeyFn = meta => { const gmt = (meta.gmtoffset || 0) * 1000; return ms => new Date(ms + gmt).toISOString().slice(0, 10); };
function toKeyed(parsed) {                       // one value per calendar day (the last one wins)
  const dk = dayKeyFn(parsed.meta), keys = [], vals = [];
  for (const p of parsed.points) {
    const k = dk(p.t);
    if (keys.length && keys[keys.length - 1] === k) vals[vals.length - 1] = p.c; else { keys.push(k); vals.push(p.c); }
  }
  return { keys, vals };
}
/* How Yahoo quotes the rate that turns one unit of `cur` into US dollars. */
const fxPair = cur => cur === 'CAD' ? { sym: 'CAD=X', invert: true, scale: 1 }
  : cur === 'GBp' ? { sym: 'GBPUSD=X', invert: false, scale: 0.01 }
  : { sym: `${cur}USD=X`, invert: false, scale: 1 };
async function usdPerSeries(cur, range) {        // history of "USD per 1 cur"
  const pair = fxPair(cur);
  const keyed = toKeyed(await loadSeries(pair.sym, range));
  if (!keyed.keys.length) throw new Error('no rate');
  keyed.vals = keyed.vals.map(v => (pair.invert ? 1 / v : v) * pair.scale);
  return keyed;
}
async function usdPerStamped(cur, range, interval) {      // "USD per 1 cur", with a timestamp for every point
  const pair = fxPair(cur);
  const parsed = await loadSeries(pair.sym, range, interval);
  if (!parsed.points.length) throw new Error('no rate');
  return { ts: parsed.points.map(p => p.t), vals: parsed.points.map(p => (pair.invert ? 1 / p.c : p.c) * pair.scale) };
}
/* Returns t -> how many `to` one unit of `from` was worth at time t. */
async function fxFactorFn(from, to, range, interval) {
  const series = {};
  await Promise.all([from, to].filter(c => c !== 'USD').map(async c => { series[c] = await usdPerStamped(c, range, interval); }));
  const at = (cur, t) => {
    if (cur === 'USD') return 1;
    const s = series[cur];
    let lo = 0, hi = s.ts.length - 1, a = -1;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (s.ts[m] <= t) { a = m; lo = m + 1; } else hi = m - 1; }
    return s.vals[a < 0 ? 0 : a];
  };
  return t => at(from, t) / at(to, t);
}
async function dailyUsdPer(cur, range) {                  // 'YYYY-MM-DD' -> USD per 1 cur
  if (cur === 'USD') return () => 1;
  const s = await usdPerSeries(cur, range);
  return d => { const i = lastLE(s.keys, d); return s.vals[i < 0 ? 0 : i]; };
}
const latestRate = { USD: 1 };                   // USD per 1 unit of each currency we have seen
const wantRates = new Set(['CAD']);
let ratesTimer = 0;
function noteCurrency(cur) {
  if (cur) wantRates.add(cur);
  clearTimeout(ratesTimer);
  ratesTimer = setTimeout(refreshRates, 40);
}
async function refreshRates() {
  let changed = false;
  await Promise.all([...wantRates].filter(c => c !== 'USD').map(async c => {
    try {
      const s = await usdPerSeries(c, '5d');
      const v = s.vals[s.vals.length - 1];
      if (v !== latestRate[c]) { latestRate[c] = v; changed = true; }
    } catch (e) { /* leave this currency unconverted */ }
  }));

}
const convert = (v, from, to) => {
  if (v == null || !from) return null;
  if (from === to) return v;
  const a = latestRate[from], b = latestRate[to];
  return a == null || b == null ? null : v * a / b;
};

    const raw = this.raw;
    if (!raw) return;
    const ct = ++this.convToken;
    const r = RANGES.find(x => x.key === raw.rangeKey) || this.rangeDef;
    const native = raw.chart.meta.currency || raw.daily.meta.currency || 'USD';
    const want = state.cur;
    let fn = null, fc = 1, show = want, note = '';
    if (native !== want) {
      try { fn = await fxFactorFn(native, want, r.range, r.interval); } catch (e) { fn = null; }
      if (!fn) {
        const c = convert(1, native, want);
        if (c != null) fc = c;
        else { show = native; note = `Couldn’t load the ${native}/${want} exchange rate, so prices are shown in ${native}.`; }
      }
    }
    if (ct !== this.convToken) return;
    const pts = raw.chart.points.map(p => { const f = fn ? fn(p.t) : fc; return { t: p.t, c: p.c * f, n: p.c, v: p.v, f }; });
    const f = pts[pts.length - 1].f;

    q.nativePrice = q.price; q.showCur = show; q.fNow = f;
    q.x = buildExtra(raw.quote, q, f, show);
    for (const k of ['price', 'prev', 'change', 'dayHigh', 'dayLow', 'high52', 'low52']) if (q[k] != null) q[k] *= f;

  /* Exchange rate on each trade date, for the position block. */
  async ensureTradeFx() {
    const q = this.quote, list = tradesFor(this.sym);
    if (!q || q.showCur === q.currency || !list.length) { this.tfn = null; return; }
    const range = rangeCovering(list[0].date);
    try {
      const [a, b] = await Promise.all([dailyUsdPer(q.currency, range), dailyUsdPer(q.showCur, range)]);
      this.tfn = d => a(d) / b(d);

    const tsFmt = dtf(q.tz, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
    const extRows = x && marketClosed ? x.ext.map(e => `<div><dt>${esc(e.label)}</dt><dd>${fmtPrice(e.price)}
        <span class="sub ${dir(e.change)}">${fmtSigned(e.change, e.price)} (${fmtPct(e.pct)})</span><span class="sub">${esc(tsFmt.format(e.t))}</span></dd></div>`).join('') : '';
    let earnTxt = '—', earnLbl = 'Earnings', earnSub = '';
    if (x && x.earn) {
      const dFmt = dtf(q.tz, { month: 'short', day: 'numeric', year: 'numeric' });
      earnTxt = dFmt.format(x.earn.t); earnLbl = x.earn.next ? 'Next earnings' : 'Last earnings';
      if (x.earn.to) earnSub = `Estimated, by ${dtf(q.tz, { month: 'short', day: 'numeric' }).format(x.earn.to)}`;
      else if (x.earn.est) earnSub = 'Estimated';
    }
    const signed = v => (v < 0 ? '−' : '') + fmtPrice(Math.abs(v));
    const valRows = `
        <div><dt>P/E ratio</dt><dd>${x && x.pe != null ? nf(2, 2).format(x.pe) : '—'}${x && x.pe == null && x.eps != null && x.eps < 0 ? '<span class="sub">Not profitable</span>' : ''}</dd></div>
        <div><dt>EPS</dt><dd>${x && x.eps != null ? signed(x.eps) + (x.epsCur ? ' ' + esc(x.epsCur) : '') : '—'}</dd></div>
        <div><dt>${earnLbl}</dt><dd>${earnTxt}${earnSub ? `<span class="sub">${esc(earnSub)}</span>` : ''}</dd></div>`;
    const posHtml = positionRows(this, q);
    f.innerHTML = `
      <div class="price"><span>${fmtPrice(q.price)}</span><span class="cur">${esc(q.showCur)}</span></div>
      ${chgHtml}
      <dl>
        ${extRows}
        ${valRows}
        <div><dt>${esc(lbl)} change</dt><dd class="${dir(wch)}">${arrow(wch)} ${fmtPct(wch)}</dd></div>
        <div><dt>High · ${esc(lbl)}</dt><dd>${fmtPrice(hi)}</dd></div>
        <div><dt>Low · ${esc(lbl)}</dt><dd>${fmtPrice(lo)}</dd></div>
        <div><dt>Day range</dt><dd>${q.dayLow != null && q.dayHigh != null ? fmtPrice(q.dayLow) + ' – ' + fmtPrice(q.dayHigh) : '—'}</dd></div>
        <div><dt>Prev close</dt><dd>${fmtPrice(q.prev)}</dd></div>
        <div><dt>Volume</dt><dd>${fmtVol(q.vol)}</dd></div>
        <div><dt>Exchange</dt><dd style="font-family:var(--font-ui)">${esc(q.exchange || '—')}</dd></div>
        ${wk}
        ${posHtml}
      </dl>
      ${asof ? `<p class="asof">As of ${esc(asof)}</p>` : ''}`;
  }

  renderTable() {
    if (!this.data) return;
    const [i0, i1] = this.win();
    const tz = this.quote ? this.quote.tz : '';
    const fmt = dtf(tz, this.intraday ? TIP_INTRADAY : TIP_DAILY);
    const rows = [];
    for (let i = i1; i >= i0 && rows.length < 400; i--) {
      const p = this.data.points[i];
      rows.push(`<tr><td>${esc(fmt.format(p.t))}</td><td>${fmtPrice(p.c)}</td><td>${fmtVol(p.v)}</td></tr>`);
    }
    this.tableEl.innerHTML = `<table><thead><tr><th>Time</th><th>Close · ${esc(this.quote ? this.quote.showCur : '')}</th><th>Volume</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
  }

  drawChart() {
    if (this.table || !this.data) return;
    const el = this.chartEl;
    const W = Math.floor(el.clientWidth), H = Math.floor(el.clientHeight);
    if (W < 120 || H < 120) return;
    const pts = this.data.points;
    const tz = this.quote ? this.quote.tz : '';
    const m = { l: 6, r: 56, t: 10, b: 24 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const [i0, i1] = this.win();
    const span = Math.max(1, i1 - i0);
    let lo = Infinity, hi = -Infinity, vmax = 0;
    for (let i = i0; i <= i1; i++) {
      const p = pts[i];
      if (p.c < lo) lo = p.c; if (p.c > hi) hi = p.c; if (p.v > vmax) vmax = p.v;
    }
    const prev = this.rangeKey === '1D' && this.quote && this.quote.prev != null ? this.quote.prev : null;
    if (prev != null) { lo = Math.min(lo, prev); hi = Math.max(hi, prev); }
    const marks = this.tradeMarks(i0, i1);
    for (const mk of marks) { lo = Math.min(lo, mk.p); hi = Math.max(hi, mk.p); }
    if (hi === lo) { const d = Math.abs(hi) * 0.01 || 1; hi += d; lo -= d; }
    const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
    const priceH = ph * 0.80, volTop = m.t + ph * 0.85, volH = ph * 0.15;
    const X = i => m.l + (i - i0) / span * pw;
    const Y = v => m.t + (1 - (v - lo) / (hi - lo)) * priceH;

    let line = '';
    for (let i = i0; i <= i1; i++) line += (i === i0 ? 'M' : 'L') + X(i).toFixed(1) + ',' + Y(pts[i].c).toFixed(1);
    const base = (m.t + priceH).toFixed(1);
    const area = `${line}L${X(i1).toFixed(1)},${base}L${X(i0).toFixed(1)},${base}Z`;

    const { ticks, decimals } = niceTicks(lo, hi, 5);
    const yfmt = nf(decimals, decimals);
    let grid = '';
    for (const t of ticks) {
      const y = Y(t).toFixed(1);
      grid += `<line x1="${m.l}" x2="${m.l + pw}" y1="${y}" y2="${y}" stroke="var(--rule-2)"/><text x="${m.l + pw + 8}" y="${(+y + 4).toFixed(1)}">${yfmt.format(t)}</text>`;
    }

    const spanMs = pts[i1].t - pts[i0].t;
    const tf = dtf(tz, tickOpts(spanMs));
    const nx = Math.max(2, Math.min(6, Math.floor(pw / 80)));
    let xl = '';
    for (let k = 0; k < nx; k++) {
      const idx = Math.round(i0 + k * (i1 - i0) / (nx - 1));
      const anchor = k === 0 ? 'start' : k === nx - 1 ? 'end' : 'middle';
      xl += `<text x="${X(idx).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${esc(tf.format(pts[idx].t))}</text>`;
    }

    const bw = Math.max(1, Math.min(8, pw / (span + 1) * 0.7));
    let vol = '';
    if (vmax > 0) {
      for (let i = i0; i <= i1; i++) {
        const h = pts[i].v / vmax * volH;
        if (h < 0.5) continue;
        vol += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${(volTop + volH - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1"/>`;
      }
    }

    const prevLine = prev != null
      ? `<line x1="${m.l}" x2="${m.l + pw}" y1="${Y(prev).toFixed(1)}" y2="${Y(prev).toFixed(1)}" stroke="var(--ink-3)" stroke-dasharray="3 4" opacity=".7"/>
         <text x="${m.l + 2}" y="${(Y(prev) - 4).toFixed(1)}">prev close</text>` : '';
    const endDot = i1 === pts.length - 1
      ? `<circle cx="${X(i1).toFixed(1)}" cy="${Y(pts[i1].c).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>` : '';
    const markSvg = marks.map(mk => {
      const x = X(mk.idx), y = Y(mk.p), up = mk.t.side === 'buy';
      const d = up ? `M${x.toFixed(1)},${(y - 7).toFixed(1)}L${(x + 6).toFixed(1)},${(y + 4.5).toFixed(1)}L${(x - 6).toFixed(1)},${(y + 4.5).toFixed(1)}Z`
                   : `M${x.toFixed(1)},${(y + 7).toFixed(1)}L${(x + 6).toFixed(1)},${(y - 4.5).toFixed(1)}L${(x - 6).toFixed(1)},${(y - 4.5).toFixed(1)}Z`;
      return `<path class="mk ${mk.t.side}" d="${d}" fill="var(--${up ? 'up' : 'down'})" stroke="var(--surface)" stroke-width="1.5" stroke-linejoin="round"/>`;
    }).join('');
    const label = `${this.sym} price in ${this.quote ? this.quote.showCur : ''} over ${this.zoom ? 'the selected window' : this.rangeKey}, from ${fmtPrice(pts[i0].c)} to ${fmtPrice(pts[i1].c)}.${marks.length ? ` Includes ${marks.length} logged trade${marks.length === 1 ? '' : 's'}.` : ''} Use the Table button for the data.`;

    el.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">
        <defs><linearGradient id="${this.gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--accent);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/>
        </linearGradient></defs>
        ${grid}
        <line x1="${m.l}" x2="${m.l + pw}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--rule)"/>
        <g fill="var(--ink-3)" opacity=".38">${vol}</g>
        ${prevLine}
        <path d="${area}" fill="url(#${this.gid})"/>
        <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${endDot}
        ${markSvg}
        ${xl}
        <rect class="sel" y="${m.t}" height="${H - m.t - m.b}" x="0" width="0" fill="var(--accent)" opacity=".14" stroke="var(--accent)" stroke-opacity=".5" style="display:none"/>
        <g class="hv" style="display:none">
          <line y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-3)" stroke-dasharray="3 3"/>
          <circle r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
        </g>
      </svg>
      <div class="tip" hidden></div>`;
    this.geo = { m, pw, ph, i0, i1, W, H, X, Y };
    this.selEl = $('.sel', el);
    this.hvEl = $('.hv', el);
    this.tipEl = $('.tip', el);
    this.marks = marks;
    this.keyEl.hidden = !marks.length;
  }

  showHover(i) {
    const g = this.geo; if (!g || !this.hvEl) return;
    const p = this.data.points[i];
    const x = g.X(i), y = g.Y(p.c);
    this.hvEl.style.display = '';
    const ln = this.hvEl.firstElementChild, dot = this.hvEl.lastElementChild;
    ln.setAttribute('x1', x); ln.setAttribute('x2', x);
    dot.setAttribute('cx', x); dot.setAttribute('cy', y);

    const first = this.data.points[g.i0].c;
    const ch = p.c - first, pct = ch / first * 100;
    const tz = this.quote ? this.quote.tz : '';
    const when = dtf(tz, this.intraday ? TIP_INTRADAY : TIP_DAILY).format(p.t);
    const tip = this.tipEl;
    const near = (this.marks || []).filter(m => Math.abs(g.X(m.idx) - x) <= 7);
    const res = near.length ? this.tradeRes() : null;
    const trades = near.map(m => tradeTipHTML(m.t, res && res[m.t.id], this.quote ? this.quote.showCur : '')).join('');
    tip.innerHTML = `<div class="t-date">${esc(when)}</div><div class="t-price">${fmtPrice(p.c)} <span class="t-cur">${esc(this.quote ? this.quote.showCur : '')}</span></div>
      <div class="t-row"><span>Since window start</span><b class="${dir(ch)}">${arrow(ch)} ${fmtPct(pct)}</b></div>
      <div class="t-row"><span>Volume</span><b>${fmtVol(p.v)}</b></div>${trades}`;
    tip.hidden = false;
    const tw = tip.offsetWidth;
    let left = x + 14;
    if (left + tw > g.W - 4) left = x - tw - 14;
    tip.style.left = Math.max(4, left) + 'px';
  }

  hideHover() {
    if (this.hvEl) this.hvEl.style.display = 'none';
    if (this.tipEl) this.tipEl.hidden = true;
  }

  /* ----- trades ----- */
  tradeRes() {
    const q = this.quote;
    if (!q || q.nativePrice == null) return null;
    const fOf = q.showCur === q.currency ? () => 1 : d => this.tfn ? this.tfn(d) : q.fNow;
    const dp = this.raw && (this.intraday ? this.raw.daily : this.raw.chart);   // daily-or-longer bars
    let closeAt = null;
    if (dp && dp.points.length) {
      const dk = dayKeyFn(dp.meta), keys = dp.points.map(p => dk(p.t));
      closeAt = d => { const i = lastLE(keys, d); return i < 0 || daysBetween(keys[i], d) > 5 ? null : dp.points[i].c; };
    }
    return tradeResults(tradesFor(this.sym), fOf, q.nativePrice, q.fNow, closeAt);
  }
  /* Where a logged trade sits on this chart. Trades have a date but no time of
     day, so on intraday charts the marker goes on that day's point whose price is
     closest to the trade price. Trades outside the visible window get no marker. */
  tradeMarks(i0, i1) {
    const list = tradesFor(this.sym);
    if (!list.length || !this.data) return [];
    const pts = this.data.points, dk = dayKeyFn(this.data.meta);
    const keys = pts.map(p => dk(p.t));
    const iv = this.rangeDef.interval, reach = iv === '1wk' ? 7 : iv === '1mo' ? 31 : 3;
    const out = [];
    for (const t of list) {
      let idx = -1;
      if (this.intraday) {
        let best = Infinity;
        for (let i = 0; i < keys.length; i++) {
          if (keys[i] !== t.date) continue;
          const d = Math.abs(pts[i].n - t.price);
          if (d < best) { best = d; idx = i; }
        }
      } else {
        let lo = 0, hi = keys.length - 1;
        while (lo <= hi) { const m = (lo + hi) >> 1; if (keys[m] <= t.date) { idx = m; lo = m + 1; } else hi = m - 1; }
        if (idx >= 0 && daysBetween(keys[idx], t.date) > reach) idx = -1;
      }
      if (idx >= i0 && idx <= i1) out.push({ t, idx, p: t.price * pts[idx].f });
    }
    return out;
  }
  syncTradeBtn() {
    const n = tradesFor(this.sym).length;
    this.tradeBtn.textContent = n ? `Trades · ${n}` : 'Log trade';
  }
  toggleTrades() {
    const open = this.tradesEl.hidden;
    if (open) {
      const q = this.quote;
      this.tradesEl.innerHTML = tradeFormHTML(this.sym, q ? q.currency : '', q ? fmtPrice(q.nativePrice) : '') + '<ul class="tlist"></ul>';
      bindTradeForm($('form', this.tradesEl), this.sym);
      this.renderTradeList();
    }
    this.tradesEl.hidden = !open;
    this.tradeBtn.setAttribute('aria-expanded', String(open));
    if (open) { const p = $('[name="price"]', this.tradesEl); if (p) p.focus(); }
  }
  renderTradeList() {
    const ul = $('.tlist', this.tradesEl);
    if (!ul) return;
    const list = tradesFor(this.sym).reverse();
    ul.innerHTML = list.length
      ? list.map(t => `<li><span class="tside ${t.side}">${t.side}</span><span>${fmtQty(t.qty)} @ ${fmtPrice(t.price)} ${esc(t.cur)}</span><span class="when">${esc(fmtDate(t.date))}</span>
          <button class="icon-btn sm" type="button" data-del="${esc(t.id)}" aria-label="Delete this ${t.side} on ${esc(fmtDate(t.date))}" title="Delete">${icon('trash', 14)}</button></li>`).join('')
      : '<li class="none">No trades logged for this ticker yet.</li>';
  }

  /* ----- folder menu ----- */
  toggleMenu() { this.menuEl.hidden ? this.openMenu() : closeMenu(); }
  openMenu() {
    if (openMenuCard && openMenuCard !== this) closeMenu();
    this.renderMenu();
    this.menuEl.hidden = false;
    this.foldersBtn.setAttribute('aria-expanded', 'true');
    this.el.classList.add('menu-open');
    openMenuCard = this;
    const first = this.menuEl.querySelector('input');
    if (first) first.focus();
  }
  renderMenu() {
    const keep = this.menuEl.contains(document.activeElement) ? document.activeElement.dataset.id : null;
    const rows = state.folders.map(f => `<label><input type="checkbox" data-id="${esc(f.id)}" ${f.tickers.includes(this.sym) ? 'checked' : ''}><span class="nav-name">${esc(f.name)}</span><span class="count">${f.tickers.length}</span></label>`).join('');
    this.menuEl.innerHTML = `<h4>Save ${esc(this.sym)} to</h4>
      ${rows || '<p class="none">No folders yet. Create one below.</p>'}
      <form><input type="text" maxlength="40" placeholder="New folder name" aria-label="New folder name"><button type="submit">Create</button></form>`;
    for (const cb of this.menuEl.querySelectorAll('input[type="checkbox"]')) {
      cb.addEventListener('change', () => setMembership(this.sym, cb.dataset.id, cb.checked));
      if (keep && cb.dataset.id === keep) cb.focus();
    }
    $('form', this.menuEl).addEventListener('submit', e => {
      e.preventDefault();
      const inp = e.target.querySelector('input');
      const name = inp.value.trim();
      if (!name) { inp.focus(); return; }
      const f = createFolder(name);
      setMembership(this.sym, f.id, true);
      toast(`Saved ${this.sym} to “${f.name}”`);
    });
  }
}

function closeMenu() {
  if (!openMenuCard) return;
  const c = openMenuCard; openMenuCard = null;
  c.menuEl.hidden = true;
  c.foldersBtn.setAttribute('aria-expanded', 'false');
  c.el.classList.remove('menu-open');
}
document.addEventListener('pointerdown', e => { if (openMenuCard && !openMenuCard.menuWrap.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && openMenuCard) { const b = openMenuCard.foldersBtn; closeMenu(); b.focus(); }
});

const getCard = sym => {
  let c = cards.get(sym);
  if (!c) { c = new Card(sym); cards.set(sym, c); }
  return c;
};

/* ---------------- trades ---------------- */
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const validDate = s => {
  if (!DATE_RE.test(s)) return false;
  const d = new Date(s + 'T00:00:00Z');
  return !isNaN(d.getTime()) && d.toISOString().slice(0, 10) === s;
};
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const daysBetween = (a, b) => (Date.parse(b) - Date.parse(a)) / DAY;
const fmtDate = s => dtf('UTC', { month: 'short', day: 'numeric', year: 'numeric' }).format(new Date(s + 'T00:00:00Z'));
const fmtQty = q => nf(0, 6).format(q);
/* Oldest first; on the same day buys count before sells. */
const tradeOrder = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.side === b.side ? 0 : a.side === 'buy' ? -1 : 1);
const tradesFor = sym => state.trades.filter(t => t.sym === sym).sort(tradeOrder);

/* Average-cost position in the ticker's own currency. */
function positionOf(sym, fOf = () => 1) {
  let qty = 0, cost = 0, realized = 0;
  for (const t of tradesFor(sym)) {
    if (t.side === 'buy') { qty += t.qty; cost += t.qty * t.price * fOf(t.date); continue; }
    const q = Math.min(t.qty, qty);
    if (q > 0) { const avg = cost / qty; realized += q * (t.price * fOf(t.date) - avg); cost -= q * avg; qty -= q; }
  }
  if (qty < 1e-9) { qty = 0; cost = 0; }
  return { qty, cost, avg: qty ? cost / qty : 0, realized };
}
/* What each single trade has made, in the display currency, against the market.
   list: this ticker's trades, oldest first. fOf(date): display units per native unit
   on that date. nowN / fNow: latest native price and its display factor.
   closeAt(date): the native closing price on or just before that date, or null. */
function tradeResults(list, fOf, nowN, fNow, closeAt) {
  const out = {}, nowD = nowN * fNow;
  let qty = 0, cost = 0;
  for (const t of list) {
    const f = fOf(t.date), paid = t.price * f;
    const close = closeAt ? closeAt(t.date) : null;
    const r = { side: t.side, paid, closeD: close != null ? close * f : null, vsClose: close ? (t.price / close - 1) * 100 : null, nowD };
    if (t.side === 'buy') {
      qty += t.qty; cost += t.qty * paid;
      r.q = t.qty; r.cost = t.qty * paid; r.value = t.qty * nowD; r.pnl = r.value - r.cost; r.pct = r.cost > 0 ? r.pnl / r.cost * 100 : 0;
    } else {
      const q = Math.min(t.qty, qty);
      const avg = qty > 0 ? cost / qty : 0;
      r.q = q; r.avg = avg; r.pnl = q * (paid - avg); r.pct = avg > 0 ? (paid / avg - 1) * 100 : 0;
      r.sinceSale = paid > 0 ? (nowD / paid - 1) * 100 : 0; r.held = q * (nowD - paid);
      if (q > 0) { cost -= q * avg; qty -= q; }
      if (qty < 1e-9) { qty = 0; cost = 0; }
    }
    out[t.id] = r;
  }
  return out;
}
function tradeTipHTML(t, r, disp, withDate = true) {
  const buy = t.side === 'buy';
  let h = `<div class="t-trade ${t.side}"><b>${buy ? 'Bought' : 'Sold'}</b> ${fmtQty(t.qty)} ${esc(t.sym)} @ ${fmtPrice(t.price)} ${esc(t.cur)}${withDate ? `<span class="t-sub">${esc(fmtDate(t.date))}</span>` : ''}`;
  if (!r) return h + '<span class="t-sub">No price data to compare with yet.</span></div>';
  const row = (k, v, cls) => `<div class="t-row"><span>${k}</span><b${cls ? ` class="${cls}"` : ''}>${v}</b></div>`;
  if (r.closeD != null) {
    h += row('Market that day', money(r.closeD, disp));
    if (r.vsClose != null) h += row(buy ? 'You paid vs market' : 'You sold vs market', fmtPct(r.vsClose));
  }
  h += row('Market now', money(r.nowD, disp));
  if (buy) {
    h += row('Cost', money(r.cost, disp)) + row('Worth now', money(r.value, disp));
    h += row('Made so far', `${money(r.pnl, disp, true)} (${fmtPct(r.pct)})`, dir(r.pnl));
  } else {
    h += row('Avg cost then', money(r.avg, disp));
    h += row('Made on sale', `${money(r.pnl, disp, true)} (${fmtPct(r.pct)})`, dir(r.pnl));
    h += row('Market since sale', fmtPct(r.sinceSale), dir(r.sinceSale));
    h += row('Holding instead', `${money(r.held, disp, true)}`, dir(r.held));
  }
  return h + '</div>';
}

function positionRows(card, q) {
  const sym = card.sym;
  if (!state.trades.some(t => t.sym === sym) || q.price == null) return '';
  const fOf = q.showCur === q.currency ? () => 1 : d => card.tfn ? card.tfn(d) : q.fNow;
  const p = positionOf(sym, fOf);
  let h = '<div class="grp">Your position</div>';
  if (p.qty > 0) {

/* The first sale that is larger than what was held at that point, or null. */
function oversold(list) {
  const held = {};
  for (const t of [...list].sort(tradeOrder)) {
    const h = held[t.sym] || 0;
    if (t.side === 'buy') held[t.sym] = h + t.qty;
    else { if (t.qty > h + 1e-9) return t; held[t.sym] = h - t.qty; }
  }

}

function rangeCovering(firstDate) {
  const days = (Date.now() - Date.parse(firstDate)) / DAY + 8;
  return days <= 28 ? '1mo' : days <= 175 ? '6mo' : days <= 360 ? '1y' : days <= 720 ? '2y' : days <= 1800 ? '5y' : days <= 3600 ? '10y' : 'max';
}
const lastLE = (keys, d) => {
  let lo = 0, hi = keys.length - 1, a = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (keys[m] <= d) { a = m; lo = m + 1; } else hi = m - 1; }
  return a;
};

async function loadPortfolio(force) {
  if (!state.trades.length) { port.raw = port.calc = null; port.err = ''; port.loading = false; port.dirty = false; updatePortfolio(); return; }
  const token = ++port.token;
  port.loading = true; port.err = '';
  if (!port.raw) updatePortfolio();
  try {
    const syms = [...new Set(state.trades.map(t => t.sym))];
    const first = state.trades.reduce((m, t) => t.date < m ? t.date : m, '9999-12-31');
    const range = rangeCovering(first), maxAge = force ? 0 : STALE_MS;
    const results = await Promise.all(syms.map(s => loadSeries(s, range, '1d', maxAge).then(d => ({ s, d }), e => ({ s, e }))));
    const need = new Set(['CAD']);
    for (const t of state.trades) need.add(t.cur);
    for (const r of results) if (r.d && r.d.meta.currency) need.add(r.d.meta.currency);

/* Everything is worked out from the trades and each day's closing price.
   Cost basis uses the average-cost method, converted at the exchange rate on
   the day of each trade; current value uses the latest rate. */
function computePortfolio(trades, raw, disp) {
  const alt = disp === 'CAD' ? 'USD' : 'CAD';
  const notes = [];
  if (!raw.fx.CAD) return { empty: true, notes: ['Couldn’t load the CAD/USD exchange rate.'] };
  const usdAt = (cur, d) => {                         // US dollars per 1 unit of cur on date d
    if (cur === 'USD') return 1;
    const s = raw.fx[cur];
    if (!s) return null;
    const i = lastLE(s.keys, d);
    return s.vals[i < 0 ? 0 : i];
  };
  const px = {};
  for (const r of raw.results) {
    if (!r.d || !r.d.points.length) { notes.push(`${r.s} couldn’t be loaded${r.e ? ' (' + r.e.message + ')' : ''}, so it is left out of the totals.`); continue; }
    const k = toKeyed(r.d), cur = r.d.meta.currency || 'USD';
    if (cur !== 'USD' && !raw.fx[cur]) { notes.push(`No exchange rate was found for ${cur}, so ${r.s} is left out of the totals.`); continue; }
    px[r.s] = { ...k, cur, name: r.d.meta.longName || r.d.meta.shortName || '' };
  }
  const mine = trades.filter(t => px[t.sym]).sort(tradeOrder);
  if (!mine.length) return { empty: true, notes };

  const syms = [...new Set(mine.map(t => t.sym))];
  const first = mine[0].date;
  const dateSet = new Set(mine.map(t => t.date));
  for (const s of syms) for (const k of px[s].keys) if (k >= first) dateSet.add(k);
  const dates = [...dateSet].sort();
  const st = {};
  for (const s of syms) st[s] = { qty: 0, cost: 0, costN: 0, realized: 0, ti: 0, tr: mine.filter(t => t.sym === s), pi: -1 };

  let invested = 0, bought = 0;
  const value = [], valueAlt = [], investedArr = [];
  for (const d of dates) {
    let vUSD = 0;
    for (const s of syms) {
      const S = st[s], P = px[s];
      while (S.ti < S.tr.length && S.tr[S.ti].date <= d) {
        const t = S.tr[S.ti++];
        const f = usdAt(P.cur, t.date) / usdAt(disp, t.date);
        if (t.side === 'buy') {
          S.qty += t.qty; S.cost += t.qty * t.price * f; S.costN += t.qty * t.price;
          invested += t.qty * t.price * f; bought += t.qty * t.price * f;
        } else {
          const q = Math.min(t.qty, S.qty);
          if (q < t.qty - 1e-9) notes.push(`Your ${s} sale on ${fmtDate(t.date)} is larger than what you held. The extra ${fmtQty(t.qty - q)} is ignored.`);
          if (q > 0) {
            const avg = S.cost / S.qty, avgN = S.costN / S.qty;
            S.realized += q * (t.price * f - avg);
            S.cost -= q * avg; S.costN -= q * avgN; S.qty -= q;
            invested -= q * t.price * f;
            if (S.qty < 1e-9) { S.qty = 0; S.cost = 0; S.costN = 0; }
          }
        }
      }
      S.pi = lastLE(P.keys, d);
      if (S.qty > 0 && S.pi >= 0) vUSD += S.qty * P.vals[S.pi] * usdAt(P.cur, d);
    }
    value.push(vUSD / usdAt(disp, d)); valueAlt.push(vUSD / usdAt(alt, d)); investedArr.push(invested);
  }

  const last = dates[dates.length - 1];
  const trRes = {};
  for (const s of syms) {
    const P = px[s], i = P.keys.length - 1;
    const fOf = d => usdAt(P.cur, d) / usdAt(disp, d);
    Object.assign(trRes, tradeResults(st[s].tr, fOf, P.vals[i], fOf(last),
      d => { const j = lastLE(P.keys, d); return j < 0 || daysBetween(P.keys[j], d) > 5 ? null : P.vals[j]; }));
  }
  const rows = [];
  let tValue = 0, tAlt = 0, tDay = 0, tUnreal = 0, tReal = 0;
  for (const s of syms) {
    const S = st[s], P = px[s];
    tReal += S.realized;
    if (S.qty <= 0 || S.pi < 0) continue;
    const price = P.vals[S.pi], prev = S.pi > 0 ? P.vals[S.pi - 1] : price;
    const f = usdAt(P.cur, last) / usdAt(disp, last), fa = usdAt(P.cur, last) / usdAt(alt, last);
    const val = S.qty * price * f;
    rows.push({
      sym: s, name: P.name, cur: P.cur, qty: S.qty, avg: S.costN / S.qty, price,
      val, valAlt: S.qty * price * fa, day: S.qty * (price - prev) * f, dayPct: prev ? (price / prev - 1) * 100 : 0,
      cost: S.cost, gain: val - S.cost, gainPct: S.cost > 0 ? (val - S.cost) / S.cost * 100 : 0,
    });
    tValue += val; tAlt += S.qty * price * fa; tDay += S.qty * (price - prev) * f; tUnreal += val - S.cost;
  }
  for (const r of rows) r.weight = tValue > 0 ? r.val / tValue * 100 : 0;
  rows.sort((a, b) => b.val - a.val);
  const gain = tValue - invested;
  return {
    notes: [...new Set(notes)], dates, value, valueAlt, invested: investedArr, rows, disp, alt, trRes,
    altPer: usdAt(disp, last) / usdAt(alt, last),    // alt-currency units per 1 unit of disp
    totals: {
      value: tValue, alt: tAlt, day: tDay, dayPct: tValue - tDay ? tDay / (tValue - tDay) * 100 : 0,
      invested, bought, realized: tReal, unrealized: tUnreal, gain, gainPct: bought > 0 ? gain / bought * 100 : 0,
    },
  };
}

function portWindow(c, key) {
  const n = c.dates.length;

}
